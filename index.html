<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contra Dance Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
        }

        [hidden] {
            display: none !important;
        }

        #dance-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        #app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #menu-view {
            flex: 1;
            overflow-y: auto;
            padding: 32px 20px;
        }

        #menu-view header,
        #dance-menu {
            max-width: 640px;
            margin: 0 auto;
        }

        #menu-view h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 4px;
        }

        #menu-view header p {
            color: #666;
            margin-bottom: 24px;
        }

        #dance-menu {
            list-style: none;
        }

        #dance-menu a {
            display: block;
            padding: 14px 16px;
            margin-bottom: 8px;
            background-color: white;
            border: 1px solid #ddd;
            border-left: 4px solid #2196f3;
            border-radius: 4px;
            color: inherit;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        #dance-menu a:hover {
            background-color: #e3f2fd;
        }

        #dance-menu .menu-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }

        #dance-menu .menu-details {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        #dance-menu .menu-support {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        #left-panel {
            width: 350px;
            background-color: white;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 20px;
        }

        #dance-info {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e0e0e0;
        }

        #dance-info h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #333;
        }

        #dance-info .author {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }

        #dance-info .formation {
            font-size: 14px;
            color: #666;
            font-style: italic;
        }

        #dance-info .notes {
            font-size: 13px;
            color: #777;
            margin-top: 8px;
        }

        #move-list {
            list-style: none;
        }

        .part-section {
            margin-bottom: 20px;
        }

        .part-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            color: #444;
            background-color: #f0f0f0;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .move-item {
            padding: 8px 10px;
            margin-bottom: 4px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .move-item:hover {
            background-color: #f8f8f8;
        }

        .move-item.current {
            background-color: #e3f2fd;
            border-left-color: #2196f3;
            font-weight: 500;
        }

        .move-item.animating {
            background-color: #c8e6c9;
            border-left-color: #4caf50;
            font-weight: 500;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                background-color: #c8e6c9;
                border-left-color: #4caf50;
            }
            50% {
                background-color: #a5d6a7;
                border-left-color: #66bb6a;
            }
        }

        .move-description {
            color: #333;
            font-size: 14px;
        }

        .move-beats {
            color: #999;
            font-size: 12px;
            margin-left: 8px;
        }

        .move-detail {
            display: block;
            color: #777;
            font-size: 12px;
        }

        .move-item.unsupported .move-description {
            color: #888;
        }

        .move-unsupported {
            display: block;
            color: #b26a00;
            font-size: 11px;
        }

        #visualization-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        #dance-canvas {
            width: auto;
            height: 100%;
            max-width: 800px;
            max-height: 100%;
            border: 1px solid #ddd;
            background-color: white;
            border-radius: 8px;
        }

        #controls {
            height: 80px;
            background-color: white;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #f0f0f0;
            border-color: #999;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #play-pause-btn {
            background-color: #2196f3;
            color: white;
            border-color: #2196f3;
            font-weight: 500;
            padding: 12px 32px;
        }

        #play-pause-btn:hover {
            background-color: #1976d2;
        }

        #menu-link {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        #menu-link:hover {
            background-color: #45a049;
        }

        @media (max-width: 768px) {
            #left-panel {
                display: none;
            }

            #app-container {
                flex-direction: column;
            }

            #visualization-panel {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div id="menu-view" hidden>
        <header>
            <h1>Contra Dance Visualizer</h1>
            <p>Choose a dance</p>
        </header>
        <ul id="dance-menu"></ul>
    </div>

    <div id="dance-view" hidden>
        <div id="app-container">
            <div id="left-panel">
                <div id="dance-info">
                    <h1 id="dance-title">No Dance Loaded</h1>
                    <div class="author" id="dance-author"></div>
                    <div class="formation" id="dance-formation"></div>
                    <div class="notes" id="dance-notes"></div>
                </div>
                <ul id="move-list"></ul>
            </div>

            <div id="visualization-panel">
                <a id="menu-link" href="#">All Dances</a>
                <svg id="dance-canvas" width="800" height="900" viewBox="0 0 800 900">
                    <text x="400" y="300" text-anchor="middle" font-size="18" fill="#999">
                        Choose a dance to begin
                    </text>
                </svg>
            </div>
        </div>

        <div id="controls">
            <button id="prev-move-btn">Previous Move</button>
            <button id="play-pause-btn">Play</button>
            <button id="next-move-btn">Next Move</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
